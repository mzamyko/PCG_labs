<body>

<h1>Лабораторная работа №2 — Чтение информации из изображений</h1>

<div class="drop-zone" id="dropZone">
  Перетащите файлы или папку сюда<br>
  <small>Поддерживаются: JPG, PNG, GIF, BMP, TIFF, PCX</small>
</div>

<div class="controls">
  <label class="btn">📂 Выбрать файлы
    <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.gif,.bmp,.tif,.tiff,.pcx">
  </label>
  <label class="btn">📁 Выбрать папку
    <input type="file" id="folderInput" webkitdirectory directory multiple>
  </label>
  <button id="exportBtn" disabled>📥 Экспорт CSV</button>
</div>

<div class="stats" id="stats">Обработано: 0 | Общий объём: 0 МБ</div>
<div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Имя файла</th>
        <th>Формат</th>
        <th>Размер файла</th>
        <th>Размер изображения (Ш×В, пикс)</th>
        <th>Разрешение (dot/inch)</th>
        <th>Глубина цвета (бит)</th>
        <th>Сжатие</th>
        <th>Доп. информация</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const $ = id => document.getElementById(id);
const tbody = $('tbody');
const statsEl = $('stats');
const progressWrap = $('progressWrap');
const progressBar = $('progressBar');
const exportBtn = $('exportBtn');

let results = [];
let totalBytes = 0;

const fmtClass = { jpeg:'fmt-jpeg', png:'fmt-png', gif:'fmt-gif',
                   bmp:'fmt-bmp', tiff:'fmt-tiff', pcx:'fmt-pcx' };

function fmtSize(b) {
  if (b < 1024) return b + ' Б';
  if (b < 1048576) return (b/1024).toFixed(1) + ' КБ';
  if (b < 1073741824) return (b/1048576).toFixed(2) + ' МБ';
  return (b/1073741824).toFixed(2) + ' ГБ';
}

function fmtDPI(x, y) {
  if (!x && !y) return '—';
  const formatNum = (n) => Number.isInteger(n) ? n.toString() : n.toFixed(1);
  if (!y) return formatNum(x);
  if (Math.abs(x - y) < 0.5) return formatNum(x);
  return formatNum(x) + ' × ' + formatNum(y);
}

function calculateDefaultDPI(format) {
  if (['jpeg', 'png', 'gif'].includes(format)) return [96, 96];
  if (['bmp', 'tiff', 'pcx'].includes(format)) return [300, 300];
  return [96, 96];
}

function getFormatByExt(name) {
  const ext = name.split('.').pop().toLowerCase();
  const map = { jpg:'jpeg', jpeg:'jpeg', png:'png', gif:'gif', 
                bmp:'bmp', tif:'tiff', tiff:'tiff', pcx:'pcx' };
  return map[ext] || null;
}

function getFormatBySignature(bytes) {
  if (bytes.length < 4) return null;
  if (bytes[0] === 0xFF && bytes[1] === 0xD8) return 'jpeg';
  if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) return 'png';
  if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) return 'gif';
  if (bytes[0] === 0x42 && bytes[1] === 0x4D) return 'bmp';
  if ((bytes[0] === 0x49 && bytes[1] === 0x49) || (bytes[0] === 0x4D && bytes[1] === 0x4D)) return 'tiff';
  if (bytes[0] === 0x0A && [0,2,3,4,5].includes(bytes[1])) return 'pcx';
  return null;
}

function readUint16LE(bytes, offset) {
  return bytes[offset] | (bytes[offset+1] << 8);
}

function readUint32LE(bytes, offset) {
  return bytes[offset] | (bytes[offset+1] << 8) | (bytes[offset+2] << 16) | (bytes[offset+3] << 24);
}

function readUint16BE(bytes, offset) {
  return (bytes[offset] << 8) | bytes[offset+1];
}

function readUint32BE(bytes, offset) {
  return (bytes[offset] << 24) | (bytes[offset+1] << 16) | (bytes[offset+2] << 8) | bytes[offset+3];
}

// Парсинг BMP файла
function parseBMP(bytes) {
  const result = { dpi: null, depth: null, compress: 'None', extra: '', width: 0, height: 0 };
  if (bytes.length < 54) { result.extra = 'Файл слишком мал'; return result; }
  
  const dibSize = readUint32LE(bytes, 14);
  result.extra = 'DIB header: ' + dibSize + ' байт';
  
  let bpp = 0, comp = 0, ppmX = 0, ppmY = 0;
  
  if (dibSize === 12) {
    result.width = readUint16LE(bytes, 18);
    result.height = readUint16LE(bytes, 20);
    bpp = readUint16LE(bytes, 24);
    result.extra += ', OS/2 формат';
  } else if (dibSize >= 40) {
    result.width = readUint32LE(bytes, 18);
    result.height = Math.abs(readUint32LE(bytes, 22));
    bpp = readUint16LE(bytes, 28);
    comp = readUint32LE(bytes, 30);
    ppmX = readUint32LE(bytes, 38);
    ppmY = readUint32LE(bytes, 42);
    result.extra += ', Windows формат';
    
    if (ppmX > 0 && ppmY > 0) {
      result.dpi = [ppmX / 39.3701, ppmY / 39.3701];
    }
  } else {
    result.width = readUint32LE(bytes, 18);
    result.height = Math.abs(readUint32LE(bytes, 22));
    bpp = readUint16LE(bytes, 28);
    result.extra += ', неизвестный DIB=' + dibSize;
  }
  
  result.depth = bpp;
  const compressMap = { 0:'None', 1:'RLE-8', 2:'RLE-4', 3:'Bitfields', 4:'JPEG', 5:'PNG' };
  result.compress = compressMap[comp] || 'Unknown(' + comp + ')';
  
  return result;
}

// Парсинг JPEG файла (ИСПРАВЛЕНО — теперь заполняет extra)
function parseJPEG(bytes) {
  const result = { dpi: null, depth: null, compress: 'baseline JPEG', extra: '', width: 0, height: 0 };
  let off = 2;
  
  let components = 0;
  let precision = 0;
  let hasEXIF = false;
  let hasICC = false;
  let hasThumbnail = false;
  
  while (off < bytes.length - 1) {
    if (bytes[off] !== 0xFF) break;
    const marker = bytes[off+1];
    off += 2;
    
    if (marker === 0xD9) break;
    if (marker >= 0xD0 && marker <= 0xD7) continue;
    
    const len = readUint16BE(bytes, off);
    if (len < 2) break;
    
    if (marker === 0xE0 && len >= 7) {
      const unit = bytes[off+2];
      const dpiX = readUint16BE(bytes, off+3);
      const dpiY = readUint16BE(bytes, off+5);
      if (unit === 2) result.dpi = [dpiX * 2.54, dpiY * 2.54];
      else if (unit === 1) result.dpi = [dpiX, dpiY];
    }
    else if (marker === 0xE1 && len >= 6) {
      // APP1 — EXIF данные
      const exifHeader = String.fromCharCode(
        bytes[off+2], bytes[off+3], bytes[off+4], bytes[off+5]
      );
      if (exifHeader === 'Exif') {
        hasEXIF = true;
      }
    }
    else if (marker === 0xE2 && len >= 6) {
      // APP2 — ICC профиль
      const iccHeader = String.fromCharCode(
        bytes[off+2], bytes[off+3], bytes[off+4], bytes[off+5]
      );
      if (iccHeader === 'ICC_') {
        hasICC = true;
      }
    }
    else if (marker === 0xE1 && len >= 6) {
      // APP1 — может быть также.thumbnail (JFIF thumbnail)
      const thumbHeader = String.fromCharCode(
        bytes[off+2], bytes[off+3], bytes[off+4], bytes[off+5]
      );
      if (thumbHeader === 'JFIF') {
        hasThumbnail = true;
      }
    }
    else if ((marker === 0xC0 || marker === 0xC2) && len >= 8) {
      precision = bytes[off+2];
      result.height = readUint16BE(bytes, off+3);
      result.width = readUint16BE(bytes, off+5);
      components = bytes[off+7];
      result.depth = precision * components;
      if (marker === 0xC2) result.compress = 'progressive JPEG';
    }
    
    off += len;
  }
  
  // Формируем строку дополнительной информации
  const extraParts = [];
  
  if (components > 0) {
    const channelNames = { 1: 'Grayscale', 3: 'YCbCr', 4: 'CMYK' };
    extraParts.push(channelNames[components] || components + ' каналов');
  }
  
  if (precision > 0) {
    extraParts.push(precision + ' бит/канал');
  }
  
  if (hasEXIF) {
    extraParts.push('EXIF');
  }
  
  if (hasICC) {
    extraParts.push('ICC-профиль');
  }
  
  if (hasThumbnail) {
    extraParts.push('thumbnail');
  }
  
  result.extra = extraParts.length > 0 ? extraParts.join(', ') : 'стандартный JPEG';
  
  return result;
}

// Парсинг PNG файла
function parsePNG(bytes) {
  const result = { dpi: null, depth: null, compress: 'deflate', extra: '', width: 0, height: 0 };
  let off = 8;
  
  while (off < bytes.length - 8) {
    const len = readUint32BE(bytes, off);
    const type = String.fromCharCode(bytes[off+4], bytes[off+5], bytes[off+6], bytes[off+7]);
    
    if (type === 'IHDR' && len >= 13) {
      result.width = readUint32BE(bytes, off+8);
      result.height = readUint32BE(bytes, off+12);
      const bitDepth = bytes[off+16];
      const colorType = bytes[off+17];
      const channels = [1,0,3,1,2,0,4][colorType] || 1;
      result.depth = bitDepth * channels;
      result.extra = 'ColorType=' + colorType + ', channels=' + channels;
    }
    else if (type === 'pHYs' && len >= 9) {
      const ppmX = readUint32BE(bytes, off+8);
      const ppmY = readUint32BE(bytes, off+12);
      const unit = bytes[off+16];
      if (unit === 1) result.dpi = [ppmX * 0.0254, ppmY * 0.0254];
    }
    else if (type === 'IEND') break;
    
    off += 12 + len;
  }
  
  return result;
}

// Парсинг GIF файла
function parseGIF(bytes) {
  const result = { dpi: null, depth: null, compress: 'LZW', extra: '', width: 0, height: 0 };
  if (bytes.length < 13) return result;
  
  result.width = readUint16LE(bytes, 6);
  result.height = readUint16LE(bytes, 8);
  
  const packed = bytes[10];
  const gctFlag = (packed >> 7) & 1;
  const colorRes = ((packed >> 4) & 7) + 1;
  const gctSize = (packed & 7) + 1;
  const gctColors = gctFlag ? Math.pow(2, gctSize) : 0;
  
  result.depth = colorRes;
  result.extra = 'Палитра: ' + gctColors + ' цветов';
  
  return result;
}

// Парсинг TIFF файла
function parseTIFF(bytes) {
  const result = { dpi: null, depth: null, compress: 'Unknown', extra: '', width: 0, height: 0 };
  if (bytes.length < 8) return result;
  
  const le = bytes[0] === 0x49;
  const read16 = le ? readUint16LE : readUint16BE;
  const read32 = le ? readUint32LE : readUint32BE;
  
  if (read16(bytes, 2) !== 42) return result;
  
  const tags = {};
  let ifdOff = read32(bytes, 4);
  let safety = 0;
  
  while (ifdOff > 0 && ifdOff + 2 <= bytes.length && safety++ < 100) {
    const count = read16(bytes, ifdOff);
    for (let i = 0; i < count; i++) {
      const eOff = ifdOff + 2 + i*12;
      if (eOff + 12 > bytes.length) break;
      const tag = read16(bytes, eOff);
      const type = read16(bytes, eOff+2);
      const cnt = read32(bytes, eOff+4);
      const valOff = eOff + 8;

      if (type === 3 && cnt === 1) tags[tag] = read16(bytes, valOff);
      else if (type === 4 && cnt === 1) tags[tag] = read32(bytes, valOff);
      else if (type === 5 && cnt === 1) {
        const o = read32(bytes, valOff);
        if (o + 8 <= bytes.length) {
          const n = read32(bytes, o), d = read32(bytes, o+4);
          tags[tag] = d ? n/d : 0;
        }
      }
    }
    ifdOff = read32(bytes, ifdOff + 2 + count*12);
  }

  result.width = tags[256] || 0;
  result.height = tags[257] || 0;
  
  const bps = tags[258] || 8;
  const spp = tags[277] || 1;
  result.depth = bps * spp;
  
  const compMap = { 1:'None', 5:'LZW', 7:'JPEG', 8:'Deflate', 32773:'PackBits' };
  result.compress = compMap[tags[259]] || 'Unknown(' + (tags[259]||'?') + ')';
  
  const dpiX = tags[282] || 0, dpiY = tags[283] || 0;
  const resUnit = tags[296] || 2;
  if (dpiX > 0 && dpiY > 0) {
    result.dpi = resUnit === 3 ? [dpiX * 2.54, dpiY * 2.54] : [dpiX, dpiY];
  }
  result.extra = 'SPP=' + spp;
  
  return result;
}

// Парсинг PCX файла
function parsePCX(bytes) {
  const result = { dpi: null, depth: null, compress: 'None', extra: '', width: 0, height: 0 };
  if (bytes.length < 128) return result;
  
  const bpp = bytes[3];
  const numPlanes = bytes[65];
  const hDpi = readUint16LE(bytes, 12);
  const vDpi = readUint16LE(bytes, 14);
  const encoding = bytes[2];
  const ver = bytes[1];
  
  const xmin = readUint16LE(bytes, 4);
  const xmax = readUint16LE(bytes, 6);
  const ymin = readUint16LE(bytes, 8);
  const ymax = readUint16LE(bytes, 10);
  result.width = xmax - xmin + 1;
  result.height = ymax - ymin + 1;
  
  result.depth = bpp * numPlanes;
  result.compress = encoding === 1 ? 'RLE' : 'None';
  if (hDpi > 0 && vDpi > 0) result.dpi = [hDpi, vDpi];
  result.extra = 'v' + ver + ', planes=' + numPlanes;
  
  return result;
}

// Получение размеров изображения через браузерный парсер
async function getImageDimensions(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      resolve({ w: img.naturalWidth, h: img.naturalHeight });
      URL.revokeObjectURL(url);
    };
    img.onerror = () => {
      resolve({ w: 0, h: 0 });
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });
}

// Обработка одного файла
async function processFile(file) {
  const headerBytes = new Uint8Array(await file.slice(0, 512).arrayBuffer());
  
  let format = getFormatBySignature(headerBytes);
  if (!format) format = getFormatByExt(file.name);
  
  if (!format) {
    return { file, format: null, dims: '—', dpi: '—', depth: '—', compress: '—', extra: 'Неизвестный формат' };
  }

  const dims = await getImageDimensions(file);
  
  let binInfo = { dpi: null, depth: null, compress: '—', extra: '', width: 0, height: 0 };
  
  try {
    const fullHeader = new Uint8Array(await file.slice(0, 65536).arrayBuffer());
    
    if (format === 'bmp') binInfo = parseBMP(fullHeader);
    else if (format === 'jpeg') binInfo = parseJPEG(fullHeader);
    else if (format === 'png') binInfo = parsePNG(fullHeader);
    else if (format === 'gif') binInfo = parseGIF(fullHeader);
    else if (format === 'tiff') binInfo = parseTIFF(fullHeader);
    else if (format === 'pcx') binInfo = parsePCX(fullHeader);
  } catch (e) {
    console.error('Parse error for', file.name, e);
  }

  const finalWidth = dims.w > 0 ? dims.w : (binInfo.width || 0);
  const finalHeight = dims.h > 0 ? dims.h : (binInfo.height || 0);
  
  let finalDpi = binInfo.dpi;
  if (!finalDpi) {
    finalDpi = calculateDefaultDPI(format);
  }

  return {
    file,
    format,
    dims: finalWidth > 0 && finalHeight > 0 ? finalWidth + ' × ' + finalHeight : '—',
    dpi: finalDpi ? fmtDPI(finalDpi[0], finalDpi[1]) : '—',
    depth: binInfo.depth || '—',
    compress: binInfo.compress || '—',
    extra: binInfo.extra || '—'
  };
}

// Обработка списка файлов
async function processFiles(files) {
  const imageExts = /\.(jpe?g|png|gif|bmp|tiff?|pcx)$/i;
  const list = Array.from(files).filter(f => imageExts.test(f.name));

  if (!list.length) {
    alert('Изображения не найдены');
    return;
  }

  $('fileInput').disabled = true;
  $('folderInput').disabled = true;
  progressWrap.style.display = 'block';
  tbody.innerHTML = '';
  results = [];
  totalBytes = 0;

  const BATCH = 5;
  for (let i = 0; i < list.length; i += BATCH) {
    const batch = list.slice(i, i + BATCH);
    
    for (const file of batch) {
      const r = await processFile(file);
      totalBytes += r.file.size;
      results.push(r);
      appendRow(r);
    }

    progressBar.style.width = ((i + batch.length) / list.length * 100) + '%';
    statsEl.textContent = 'Обработано: ' + Math.min(i+batch.length, list.length) + ' / ' + list.length + ' | Общий объём: ' + fmtSize(totalBytes);

    await new Promise(r => requestAnimationFrame(r));
  }

  exportBtn.disabled = results.length === 0;
  $('fileInput').disabled = false;
  $('folderInput').disabled = false;
  progressWrap.style.display = 'none';
}

// Добавление строки в таблицу
function appendRow(r) {
  const tr = document.createElement('tr');
  const fmt = r.format ? r.format.toUpperCase() : '—';
  const cls = r.format ? fmtClass[r.format] || '' : '';

  tr.innerHTML = '<td title="' + r.file.name + '">' + 
    (r.file.name.length > 40 ? r.file.name.slice(0,37)+'...' : r.file.name) + 
    '</td><td class="fmt ' + cls + '">' + fmt + 
    '</td><td>' + fmtSize(r.file.size) + 
    '</td><td>' + r.dims + 
    '</td><td>' + r.dpi + 
    '</td><td>' + r.depth + 
    '</td><td>' + r.compress + 
    '</td><td>' + r.extra + '</td>';
  tbody.appendChild(tr);
}

// Экспорт результатов в CSV
function exportCSV() {
  const headers = ['Имя файла','Формат','Размер файла','Ширина','Высота','DPI X','DPI Y','Глубина цвета','Сжатие','Доп. информация'];
  const rows = results.map(r => {
    const dims = (r.dims||'—').split('×').map(s=>s.trim());
    const dpi = (r.dpi||'—').split('×').map(s=>s.trim());
    return [r.file.name, r.format?.toUpperCase()||'', fmtSize(r.file.size),
            dims[0]||'', dims[1]||'', dpi[0]||'', dpi[1]||'', r.depth||'', r.compress||'', r.extra||''];
  });
  const csv = [headers, ...rows]
    .map(row => row.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(';'))
    .join('\n');
  const blob = new Blob(['\ufeff'+csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lab2_results.csv';
  a.click();
}

// Обработчики событий
$('fileInput').addEventListener('change', e => processFiles(e.target.files));
$('folderInput').addEventListener('change', e => processFiles(e.target.files));
$('exportBtn').addEventListener('click', exportCSV);

const dz = $('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('active'); });
dz.addEventListener('dragleave', () => dz.classList.remove('active'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('active');
  const items = e.dataTransfer.items;
  if (items) {
    const files = [];
    const entries = [];
    for (const it of items) {
      const entry = it.webkitGetAsEntry?.();
      if (entry) entries.push(entry);
      else if (it.kind === 'file') files.push(it.getAsFile());
    }
    if (entries.length) traverseEntries(entries, files);
    else if (files.length) processFiles(files);
  }
});

// Рекурсивный обход папок при drag&drop
function traverseEntries(entries, files) {
  const proms = entries.map(e => new Promise(res => {
    if (e.isFile) e.file(f => { files.push(f); res(); });
    else if (e.isDirectory) {
      const r = e.createReader();
      r.readEntries(ch => traverseEntries(ch, files).then(res));
    } else res();
  }));
  return Promise.all(proms).then(() => processFiles(files));
}
