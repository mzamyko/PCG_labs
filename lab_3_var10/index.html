<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторная работа 3</title>
  <style>
:root {
  --bg: #15161a;
  --panel: #1d1f24;
  --panel-2: #24262c;
  --border: #33353c;
  --text: #eae7e1;
  --text-dim: #9a9ca3;
  --text-faint: #63656c;
  --accent: #315efb;
  --accent-dark: #244bd6;
  --accent-soft: #2a2f3e;
  --sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  --mono: 'Cascadia Code', 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; overflow: hidden; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.2px;
}
.file-button {
  background: var(--panel-2);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 6px;
  font-weight: 500;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid var(--border);
  font-family: var(--sans);
}
.file-button:hover { border-color: var(--text-faint); }
.file-button input { display: none; }

.layout { display: flex; flex: 1; gap: 14px; padding: 14px; overflow: hidden; }

.sidebar {
  width: 240px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar h2 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: 0.3px;
}
.field { margin-bottom: 10px; }
.field > span {
  display: block;
  color: var(--text-faint);
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 5px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.field select, .field input[type="range"] {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  background: var(--panel-2);
  color: var(--text);
  font-family: var(--sans);
}
.field select:focus, .field input[type="range"]:focus {
  outline: none;
  border-color: var(--text-dim);
}
.field input[type="checkbox"] {
  accent-color: var(--accent);
  margin-right: 6px;
}

.button {
  border: 0;
  border-radius: 4px;
  padding: 9px 12px;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
  font-size: 13px;
  font-family: var(--sans);
  letter-spacing: 0.2px;
}
.button.primary { background: var(--accent); color: #fff; }
.button.primary:hover:not(:disabled) { background: var(--accent-dark); }
.button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
.button.secondary:hover:not(:disabled) { border-color: var(--text-faint); }
.button:disabled { opacity: 0.4; cursor: not-allowed; }
.hidden { display: none !important; }
.progress-wrap { margin-top: 12px; }
.progress-track { height: 4px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.15s; }

.workspace { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }

.canvas-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; flex: 1; min-height: 0; }
.image-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  display: flex;
  flex-direction: column;
}
.image-card h2 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}
.method-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 8px;
  padding: 4px 10px;
  background: var(--panel-2);
  border-radius: 4px;
  text-align: center;
  letter-spacing: 0.3px;
}
.canvas-shell {
  flex: 1;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel-2);
  overflow: hidden;
  min-height: 0;
}
.canvas-shell canvas { max-width: 100%; max-height: 100%; }

.histogram-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; height: 110px; flex-shrink: 0; }
.histogram-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}
.histogram-card h2 {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-dim);
  letter-spacing: 0.3px;
}
.histogram-grid canvas {
  width: 100%;
  height: 75px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel-2);
}

.result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; flex-shrink: 0; }
.result-grid > div {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
}
.result-grid span {
  display: block;
  color: var(--text-faint);
  font-size: 10px;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}
.result-grid strong {
  display: block;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
  letter-spacing: 0.2px;
}
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Лабораторная работа 3 — Обработка изображений</h1>
    <label class="file-button">
      Загрузить изображение
      <input id="fileInput" type="file" accept="image/*">
    </label>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Метод обработки</h2>
      <label class="field">
        <span>Раздел</span>
        <select id="categorySelect">
          <option value="global">Глобальная пороговая обработка</option>
          <option value="adaptive">Адаптивная пороговая обработка</option>
          <option value="rank">Нелинейные фильтры</option>
        </select>
      </label>
      <div id="methodControls"></div>
      <button id="processBtn" class="button primary" disabled>Обработать</button>
      <button id="compareBtn" class="button secondary hidden">Сравнить два метода</button>
      <div class="progress-wrap">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>
    </aside>

    <section class="workspace">
      <div class="canvas-grid">
        <article class="image-card">
          <h2>Исходное изображение</h2>
          <div class="canvas-shell"><canvas id="sourceCanvas"></canvas></div>
        </article>
        <article class="image-card">
          <h2 id="resultTitle">Результат</h2>
          <div id="resultLabel" class="method-label hidden"></div>
          <div class="canvas-shell"><canvas id="resultCanvas"></canvas></div>
        </article>
        <article class="image-card hidden" id="compareCard">
          <h2 id="compareTitle">Результат 2</h2>
          <div id="compareLabel" class="method-label hidden"></div>
          <div class="canvas-shell"><canvas id="compareCanvas"></canvas></div>
        </article>
      </div>
      <div class="histogram-grid">
        <article class="histogram-card">
          <h2>Гистограмма до</h2>
          <canvas id="histBefore" width="700" height="220"></canvas>
        </article>
        <article class="histogram-card">
          <h2>Гистограмма после (метод 1)</h2>
          <canvas id="histAfter" width="700" height="220"></canvas>
        </article>
        <article class="histogram-card hidden" id="histCompareCard">
          <h2>Гистограмма после (метод 2)</h2>
          <canvas id="histCompare" width="700" height="220"></canvas>
        </article>
      </div>
      <div class="result-grid">
        <div><span>Метод</span><strong id="metricMethod">—</strong></div>
        <div><span>Время</span><strong id="metricTime">—</strong></div>
        <div><span>Параметры</span><strong id="metricParams">—</strong></div>
      </div>
    </section>
  </main>

  <script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const state = { width: 0, height: 0, rgba: null, gray: null };

  const sourceCanvas = $('sourceCanvas');
  const resultCanvas = $('resultCanvas');
  const compareCanvas = $('compareCanvas');
  const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });
  const resultCtx = resultCanvas.getContext('2d', { willReadFrequently: true });
  const compareCtx = compareCanvas.getContext('2d', { willReadFrequently: true });

  function setProgress(value) {
    $('progressBar').style.width = Math.round(value * 100) + '%';
  }

  function drawRgba(canvas, ctx, rgba, width, height) {
    canvas.width = width; canvas.height = height;
    ctx.putImageData(new ImageData(new Uint8ClampedArray(rgba), width, height), 0, 0);
  }

  function drawGray(canvas, ctx, gray, width, height) {
    const rgba = new Uint8ClampedArray(gray.length * 4);
    for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
      rgba[p] = gray[i]; rgba[p+1] = gray[i]; rgba[p+2] = gray[i]; rgba[p+3] = 255;
    }
    drawRgba(canvas, ctx, rgba, width, height);
  }

  function drawEmpty(canvas, ctx, text) {
    canvas.width = 400; canvas.height = 250;
    ctx.fillStyle = '#24262c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#63656c'; ctx.font = '15px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  }

  function drawHistogram(canvas, gray) {
    const ctx = canvas.getContext('2d');
    const width = canvas.width, height = canvas.height;
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#24262c'; ctx.fillRect(0, 0, width, height);
    if (!gray) return;
    const histogram = new Uint32Array(256);
    for (let i = 0; i < gray.length; i++) histogram[gray[i]]++;
    let max = 1;
    for (let i = 0; i < 256; i++) if (histogram[i] > max) max = histogram[i];
    const barWidth = width / 256;
    ctx.fillStyle = '#315efb';
    for (let i = 0; i < 256; i++) {
      const barHeight = (histogram[i] / max) * (height - 5);
      ctx.fillRect(i * barWidth, height - barHeight, Math.max(1, barWidth), barHeight);
    }
  }

  function rgbaToGray(rgba, width, height) {
    const gray = new Uint8Array(width * height);
    for (let i = 0, p = 0; p < gray.length; i += 4, p++) {
      gray[p] = Math.round(0.299 * rgba[i] + 0.587 * rgba[i+1] + 0.114 * rgba[i+2]);
    }
    return gray;
  }

  function otsuThreshold(gray) {
    const histogram = new Uint32Array(256);
    for (let i = 0; i < gray.length; i++) histogram[gray[i]]++;
    const total = gray.length;
    let weightedSum = 0;
    for (let i = 0; i < 256; i++) weightedSum += i * histogram[i];
    let backgroundWeight = 0, backgroundSum = 0, bestThreshold = 0, bestVariance = -1;
    for (let threshold = 0; threshold < 256; threshold++) {
      backgroundWeight += histogram[threshold];
      if (backgroundWeight === 0) continue;
      const foregroundWeight = total - backgroundWeight;
      if (foregroundWeight === 0) break;
      backgroundSum += threshold * histogram[threshold];
      const backgroundMean = backgroundSum / backgroundWeight;
      const foregroundMean = (weightedSum - backgroundSum) / foregroundWeight;
      const difference = backgroundMean - foregroundMean;
      const variance = backgroundWeight * foregroundWeight * difference * difference;
      if (variance > bestVariance) { bestVariance = variance; bestThreshold = threshold; }
    }
    return bestThreshold;
  }

  function intermeansThreshold(gray) {
    let min = 255, max = 0;
    for (let i = 0; i < gray.length; i++) {
      if (gray[i] < min) min = gray[i];
      if (gray[i] > max) max = gray[i];
    }
    let threshold = (min + max) / 2;
    let iterations = 0;
    while (iterations < 100) {
      let lowSum = 0, lowCount = 0, highSum = 0, highCount = 0;
      for (let i = 0; i < gray.length; i++) {
        if (gray[i] <= threshold) { lowSum += gray[i]; lowCount++; }
        else { highSum += gray[i]; highCount++; }
      }
      if (lowCount === 0 || highCount === 0) break;
      const next = 0.5 * (lowSum / lowCount + highSum / highCount);
      if (Math.abs(next - threshold) < 0.5) { threshold = next; iterations++; break; }
      threshold = next;
      iterations++;
    }
    return { threshold: Math.round(threshold), iterations };
  }

  function applyGlobalThreshold(gray, threshold, invert) {
    const output = new Uint8Array(gray.length);
    for (let i = 0; i < gray.length; i++) {
      const white = gray[i] > threshold;
      output[i] = white !== invert ? 255 : 0;
    }
    return output;
  }

  function buildIntegralImages(gray, width, height) {
    const stride = width + 1;
    const size = stride * (height + 1);
    const sum = new Float64Array(size);
    const sqSum = new Float64Array(size);
    for (let y = 1; y <= height; y++) {
      let rowSum = 0, rowSqSum = 0;
      const srcRow = (y - 1) * width;
      const currentRow = y * stride;
      const previousRow = (y - 1) * stride;
      for (let x = 1; x <= width; x++) {
        const value = gray[srcRow + x - 1];
        rowSum += value; rowSqSum += value * value;
        sum[currentRow + x] = sum[previousRow + x] + rowSum;
        sqSum[currentRow + x] = sqSum[previousRow + x] + rowSqSum;
      }
    }
    return { sum, sqSum, stride };
  }

  function rectangleSum(integral, stride, x0, y0, x1, y1) {
    return integral[(y1+1)*stride+(x1+1)] - integral[y0*stride+(x1+1)] - integral[(y1+1)*stride+x0] + integral[y0*stride+x0];
  }

  function sauvolaThreshold(gray, width, height, radius, k) {
    const integrals = buildIntegralImages(gray, width, height);
    const output = new Uint8Array(gray.length);
    const dynamicRange = 128;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const x0 = Math.max(0, x - radius), y0 = Math.max(0, y - radius);
        const x1 = Math.min(width - 1, x + radius), y1 = Math.min(height - 1, y + radius);
        const count = (x1 - x0 + 1) * (y1 - y0 + 1);
        const sum = rectangleSum(integrals.sum, integrals.stride, x0, y0, x1, y1);
        const sqSum = rectangleSum(integrals.sqSum, integrals.stride, x0, y0, x1, y1);
        const mean = sum / count;
        const variance = Math.max(0, sqSum / count - mean * mean);
        const stdDev = Math.sqrt(variance);
        const threshold = mean * (1 + k * (stdDev / dynamicRange - 1));
        output[y * width + x] = gray[y * width + x] > threshold ? 255 : 0;
      }
    }
    return output;
  }

  function medianFilter(gray, width, height, radius) {
    const output = new Uint8Array(gray.length);
    const histogram = new Uint32Array(256);
    const windowSize = (2 * radius + 1) * (2 * radius + 1);
    const target = Math.floor(windowSize / 2);

    function findMedian() {
      let sum = 0;
      for (let v = 0; v < 256; v++) {
        sum += histogram[v];
        if (sum > target) return v;
      }
      return 255;
    }
    function addPixel(x, y) {
      const nx = Math.max(0, Math.min(width - 1, x));
      const ny = Math.max(0, Math.min(height - 1, y));
      histogram[gray[ny * width + nx]]++;
    }
    function removePixel(x, y) {
      const nx = Math.max(0, Math.min(width - 1, x));
      const ny = Math.max(0, Math.min(height - 1, y));
      histogram[gray[ny * width + nx]]--;
    }

    for (let y = 0; y < height; y++) {
      if (y === 0) {
        histogram.fill(0);
        for (let dy = -radius; dy <= radius; dy++) {
          for (let dx = -radius; dx <= radius; dx++) {
            addPixel(0 + dx, y + dy);
          }
        }
      } else {
        const removeX = 0 - radius - 1;
        const addX = 0 + radius;
        for (let dy = -radius; dy <= radius; dy++) {
          removePixel(removeX, y + dy);
          addPixel(addX, y + dy);
        }
      }
      output[y * width] = findMedian();
      for (let x = 1; x < width; x++) {
        const removeX = x - radius - 1;
        const addX = x + radius;
        for (let dy = -radius; dy <= radius; dy++) {
          removePixel(removeX, y + dy);
          addPixel(addX, y + dy);
        }
        output[y * width + x] = findMedian();
      }
    }
    return output;
  }

  function loadImageUrl(url) {
    setProgress(0.1);
    const image = new Image();
    image.onload = function () {
      const canvas = document.createElement('canvas');
      canvas.width = image.naturalWidth || image.width;
      canvas.height = image.naturalHeight || image.height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(image, 0, 0);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
      state.width = canvas.width; state.height = canvas.height;
      state.rgba = new Uint8ClampedArray(data.data);
      state.gray = rgbaToGray(state.rgba, state.width, state.height);
      drawRgba(sourceCanvas, sourceCtx, state.rgba, state.width, state.height);
      drawHistogram($('histBefore'), state.gray);
      $('processBtn').disabled = false;
      $('compareBtn').disabled = false;
      setProgress(1);
    };
    image.src = url;
  }

  function renderControls() {
    const category = $('categorySelect').value;
    const container = $('methodControls');
    if (category === 'global') {
      container.innerHTML = '<label class="field"><span>Метод</span><select id="globalMethod"><option value="otsu">Otsu</option><option value="intermeans">Iterative Intermeans</option></select></label><label class="field" style="display:flex;align-items:center;gap:6px;margin-top:4px;"><input type="checkbox" id="invert"><span style="margin:0;text-transform:none;font-size:12px;">Инвертировать</span></label>';
      $('compareBtn').classList.remove('hidden');
    } else if (category === 'adaptive') {
      container.innerHTML = '<label class="field"><span>Радиус</span><input type="range" id="adaptiveRadius" min="3" max="40" value="15"></label><label class="field"><span>Коэффициент k</span><input type="range" id="adaptiveK" min="0.05" max="0.80" step="0.01" value="0.34"></label>';
      $('compareBtn').classList.add('hidden');
    } else {
      container.innerHTML = '<label class="field"><span>Радиус</span><input type="range" id="rankRadius" min="1" max="6" value="1"></label>';
      $('compareBtn').classList.add('hidden');
    }
  }

  function processCurrent() {
    if (!state.gray) return;
    const category = $('categorySelect').value;
    const started = performance.now();
    setProgress(0.1);

    if (category === 'rank') {
      const radius = parseInt($('rankRadius').value);
      $('processBtn').disabled = true;
      const chunkSize = 20;
      let y = 0;
      const output = new Uint8Array(state.width * state.height);
      const histogram = new Uint32Array(256);
      const windowSize = (2 * radius + 1) * (2 * radius + 1);
      const target = Math.floor(windowSize / 2);

      function findMedian() {
        let sum = 0;
        for (let v = 0; v < 256; v++) { sum += histogram[v]; if (sum > target) return v; }
        return 255;
      }
      function addPixel(x, y) {
        const nx = Math.max(0, Math.min(state.width - 1, x));
        const ny = Math.max(0, Math.min(state.height - 1, y));
        histogram[state.gray[ny * state.width + nx]]++;
      }
      function removePixel(x, y) {
        const nx = Math.max(0, Math.min(state.width - 1, x));
        const ny = Math.max(0, Math.min(state.height - 1, y));
        histogram[state.gray[ny * state.width + nx]]--;
      }

      function processChunk() {
        const endY = Math.min(y + chunkSize, state.height);
        for (; y < endY; y++) {
          if (y === 0) {
            histogram.fill(0);
            for (let dy = -radius; dy <= radius; dy++) {
              for (let dx = -radius; dx <= radius; dx++) { addPixel(0 + dx, y + dy); }
            }
          } else {
            for (let dy = -radius; dy <= radius; dy++) {
              removePixel(0 - radius - 1, y + dy);
              addPixel(0 + radius, y + dy);
            }
          }
          output[y * state.width] = findMedian();
          for (let x = 1; x < state.width; x++) {
            for (let dy = -radius; dy <= radius; dy++) {
              removePixel(x - radius - 1, y + dy);
              addPixel(x + radius, y + dy);
            }
            output[y * state.width + x] = findMedian();
          }
        }
        setProgress(y / state.height);
        if (y < state.height) { requestAnimationFrame(processChunk); }
        else {
          drawGray(resultCanvas, resultCtx, output, state.width, state.height);
          drawHistogram($('histAfter'), output);
          $('histCompareCard').classList.add('hidden');
          $('metricMethod').textContent = 'Медианный фильтр';
          $('metricTime').textContent = (performance.now() - started).toFixed(1) + ' мс';
          $('metricParams').textContent = 'радиус = ' + radius;
          $('compareCard').classList.add('hidden');
          $('resultLabel').classList.add('hidden');
          $('resultTitle').textContent = 'Результат';
          setProgress(1);
          $('processBtn').disabled = false;
        }
      }
      requestAnimationFrame(processChunk);
      return;
    }

    setTimeout(() => {
      try {
        if (category === 'global') {
          const method = $('globalMethod').value;
          const invert = $('invert').checked;
          const threshold = otsuThreshold(state.gray);
          const output = applyGlobalThreshold(state.gray, threshold, invert);
          drawGray(resultCanvas, resultCtx, output, state.width, state.height);
          drawHistogram($('histAfter'), output);
          $('histCompareCard').classList.add('hidden');
          $('metricMethod').textContent = method === 'otsu' ? 'Otsu' : 'Iterative Intermeans';
          $('metricTime').textContent = (performance.now() - started).toFixed(1) + ' мс';
          $('metricParams').textContent = 'порог = ' + threshold;
          $('compareCard').classList.add('hidden');
          $('resultLabel').classList.add('hidden');
          $('resultTitle').textContent = 'Результат';
        } else if (category === 'adaptive') {
          const radius = parseInt($('adaptiveRadius').value);
          const k = parseFloat($('adaptiveK').value);
          const output = sauvolaThreshold(state.gray, state.width, state.height, radius, k);
          drawGray(resultCanvas, resultCtx, output, state.width, state.height);
          drawHistogram($('histAfter'), output);
          $('histCompareCard').classList.add('hidden');
          $('metricMethod').textContent = 'Sauvola';
          $('metricTime').textContent = (performance.now() - started).toFixed(1) + ' мс';
          $('metricParams').textContent = 'радиус = ' + radius + ', k = ' + k;
          $('compareCard').classList.add('hidden');
          $('resultLabel').classList.add('hidden');
          $('resultTitle').textContent = 'Результат';
        }
        setProgress(1);
      } catch (error) {
        console.error(error);
        alert('Ошибка: ' + error.message);
      }
    }, 10);
  }

  function compareGlobalMethods() {
    if (!state.gray) return;
    setProgress(0.1);
    const started = performance.now();
    setTimeout(() => {
      try {
        const invert = $('invert').checked;
        const otsu = otsuThreshold(state.gray);
        const intermeans = intermeansThreshold(state.gray);
        const output1 = applyGlobalThreshold(state.gray, otsu, invert);
        const output2 = applyGlobalThreshold(state.gray, intermeans.threshold, invert);
        drawGray(resultCanvas, resultCtx, output1, state.width, state.height);
        drawGray(compareCanvas, compareCtx, output2, state.width, state.height);
        drawHistogram($('histAfter'), output1);
        drawHistogram($('histCompare'), output2);
        $('histCompareCard').classList.remove('hidden');
        $('metricMethod').textContent = 'Otsu / Intermeans';
        $('metricTime').textContent = (performance.now() - started).toFixed(1) + ' мс';
        $('metricParams').textContent = 'пороги: ' + otsu + ' / ' + intermeans.threshold;
        $('compareCard').classList.remove('hidden');
        $('resultTitle').textContent = 'Otsu';
        $('resultLabel').textContent = 'Порог: ' + otsu;
        $('resultLabel').classList.remove('hidden');
        $('compareTitle').textContent = 'Iterative Intermeans';
        $('compareLabel').textContent = 'Порог: ' + intermeans.threshold;
        $('compareLabel').classList.remove('hidden');
        setProgress(1);
      } catch (error) {
        console.error(error);
        alert('Ошибка: ' + error.message);
      }
    }, 10);
  }

  $('categorySelect').addEventListener('change', renderControls);
  $('processBtn').addEventListener('click', processCurrent);
  $('compareBtn').addEventListener('click', compareGlobalMethods);
  $('fileInput').addEventListener('change', function (event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () { loadImageUrl(reader.result); };
    reader.readAsDataURL(file);
  });

  drawEmpty(sourceCanvas, sourceCtx, 'Загрузите изображение');
  drawEmpty(resultCanvas, resultCtx, 'Нажмите "Обработать"');
  drawEmpty(compareCanvas, compareCtx, 'Сравнение');
  renderControls();
})();
  </script>
</body>
</html>
